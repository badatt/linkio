name: _build
description: |
  This workflow builds the API and Web code for the project.
  It is designed to be reusable and can be called from other workflows.
  The workflow is triggered by a workflow call, which means it can be invoked from other workflows.

on:
  workflow_call:
    inputs:
      environment:
        description: 'The environment to build for'
        required: true
        type: string
      api_domain:
        description: 'The domain of the API'
        required: true
        type: string

jobs:
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    env:
      CI: true
      FORCE_COLOR: true
    defaults:
      run:
        shell: bash
        working-directory: ./api

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          working_directory: ./api

      - name: Build API
        run: |
          echo "Building API ..."
          sh build.sh

      - name: Upload API build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: ./api/build

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    env:
      CI: true
      FORCE_COLOR: true
    defaults:
      run:
        shell: bash
        working-directory: ./web

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          working_directory: ./web

      - name: Build Web
        env:
          VITE_API_URL: https://${{ inputs.api_domain }}
        run: |
          echo "Building Web ..."
          echo "VITE_API_URL: $VITE_API_URL"
          export BUILD_TARGET=${{ inputs.environment }}
          npm run build:$BUILD_TARGET

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: ./web/dist
