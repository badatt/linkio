name: CDK action
description: |
  This action runs a specified AWS CDK command in the infra directory.
  It is designed to be reusable and can be called from other workflows.
  The action is triggered by a workflow call, which means it can be invoked from other workflows.
inputs:
  working_directory:
    description: The working directory for the action.
    required: true
  aws_account_id:
    description: The AWS account ID to configure.
    required: true
  aws_role_to_assume:
    description: The ARN of the role to assume for AWS credentials.
    required: true
  aws_default_region:
    description: The AWS region to configure.
    required: true
  app_name:
    description: The name of the app to deploy.
    required: true
  api_custom_domain:
    description: The custom domain for the API.
    required: false
  aws_api_certificate_arn:
    description: The ARN of the AWS API certificate.
    required: false
  aws_hosted_zone_id:
    description: The ID of the AWS hosted zone.
    required: false
  command:
    description: The command to run for the CDK action.
    required: true

runs:
  using: 'composite'

  steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws_role_to_assume }}
        aws-region: ${{ inputs.aws_default_region }}

    - name: Run CDK bootstrap
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        AWS_ACCOUNT_ID: ${{ inputs.aws_account_id }}
        AWS_DEFAULT_REGION: ${{ inputs.aws_default_region }}
        APP_NAME: ${{ inputs.app_name }}
        API_CUSTOM_DOMAIN: ${{ inputs.api_custom_domain }}
        AWS_API_CERTIFICATE_ARN: ${{ inputs.aws_api_certificate_arn }}
        AWS_HOSTED_ZONE_ID: ${{ inputs.aws_hosted_zone_id }}
      run: |
        echo "Bootstrap CDK"
        npm run bootstrap

    - name: Run CDK command
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        AWS_ACCOUNT_ID: ${{ inputs.aws_account_id }}
        AWS_DEFAULT_REGION: ${{ inputs.aws_default_region }}
        APP_NAME: ${{ inputs.app_name }}
        API_CUSTOM_DOMAIN: ${{ inputs.api_custom_domain }}
        AWS_API_CERTIFICATE_ARN: ${{ inputs.aws_api_certificate_arn }}
        AWS_HOSTED_ZONE_ID: ${{ inputs.aws_hosted_zone_id }}
      run: |
        echo "${{ inputs.command }} AWS stack"
        npm run ${{ inputs.command }}
